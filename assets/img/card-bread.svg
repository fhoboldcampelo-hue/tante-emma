<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration von frisch gebackenem Brot">
  <rect width="800" height="600" fill="#EFE3CD"/>
  <g opacity=".22" fill="#B98555"><circle cx="90" cy="90" r="26"/><circle cx="720" cy="70" r="26"/><circle cx="700" cy="530" r="24"/></g>

  <!-- linen cloth -->
  <path d="M0 430c140-40 260 20 400-6s270-34 400 4v172H0z" fill="#FBF8F2"/>
  <g stroke="#E2D6C0" stroke-width="4" opacity=".9">
    <path d="M0 470c150-38 268 22 404-4s268-32 396 6"/>
    <path d="M0 520c150-38 268 22 404-4s268-32 396 6"/>
  </g>

  <!-- big boule -->
  <g>
    <ellipse cx="300" cy="392" rx="200" ry="122" fill="#C79157"/>
    <ellipse cx="300" cy="378" rx="200" ry="116" fill="#D9A467"/>
    <ellipse cx="264" cy="352" rx="150" ry="80" fill="#E5B67D"/>
    <!-- scoring -->
    <g stroke="#A97647" stroke-width="10" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M204 336c40-40 96-58 154-52"/>
      <path d="M236 396c44-46 108-66 172-58"/>
      <path d="M270 452c44-42 106-60 168-52"/>
    </g>
    <g stroke="#F6EBDA" stroke-width="6" fill="none" opacity=".75">
      <path d="M214 330c40-38 96-56 152-50"/>
      <path d="M246 390c44-44 108-64 170-56"/>
    </g>
    <!-- flour dust -->
    <g fill="#FBF8F2" opacity=".7">
      <circle cx="196" cy="300" r="8"/><circle cx="360" cy="292" r="7"/>
      <circle cx="420" cy="360" r="6"/><circle cx="150" cy="392" r="7"/>
    </g>
  </g>

  <!-- baguette -->
  <g transform="rotate(-14 620 400)">
    <rect x="440" y="352" width="360" height="76" rx="38" fill="#D9A467"/>
    <rect x="452" y="360" width="336" height="58" rx="29" fill="#E5B67D"/>
    <g stroke="#A97647" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M500 376l40 30M560 372l40 30M620 368l40 30M680 366l40 30"/>
    </g>
    <g fill="#FBF8F2" opacity=".7"><circle cx="540" cy="386" r="5"/><circle cx="660" cy="382" r="5"/><circle cx="736" cy="392" r="4"/></g>
  </g>

  <!-- small rolls -->
  <g>
    <ellipse cx="132" cy="512" rx="70" ry="46" fill="#C79157"/>
    <ellipse cx="132" cy="502" rx="70" ry="42" fill="#D9A467"/>
    <path d="M84 500c30-18 66-18 96 0" stroke="#A97647" stroke-width="8" fill="none"/>
    <ellipse cx="250" cy="536" rx="62" ry="40" fill="#C79157"/>
    <ellipse cx="250" cy="528" rx="62" ry="37" fill="#E5B67D"/>
    <path d="M210 526c26-16 58-16 82 0" stroke="#A97647" stroke-width="8" fill="none"/>
  </g>

  <!-- wheat sprig -->
  <g transform="translate(690 120) rotate(12)">
    <path d="M0 0v210" stroke="#8B9679" stroke-width="7" fill="none"/>
    <g fill="#D9A441">
      <ellipse cx="0" cy="30" rx="12" ry="26"/><ellipse cx="-22" cy="66" rx="11" ry="24" transform="rotate(-28 -22 66)"/>
      <ellipse cx="22" cy="66" rx="11" ry="24" transform="rotate(28 22 66)"/>
      <ellipse cx="-22" cy="112" rx="11" ry="24" transform="rotate(-28 -22 112)"/>
      <ellipse cx="22" cy="112" rx="11" ry="24" transform="rotate(28 22 112)"/>
      <ellipse cx="-20" cy="158" rx="11" ry="24" transform="rotate(-28 -20 158)"/>
      <ellipse cx="20" cy="158" rx="11" ry="24" transform="rotate(28 20 158)"/>
    </g>
  </g>

  <rect width="800" height="600" fill="#49352B" opacity=".04"/>
</svg>
