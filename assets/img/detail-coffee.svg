<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration eines Cappuccinos mit Latte Art auf Holztisch">
  <defs>
    <radialGradient id="k-table" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#C9A276"/>
      <stop offset="1" stop-color="#A5794F"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#k-table)"/>
  <g stroke="#8F6742" stroke-width="5" opacity=".5">
    <path d="M0 130h1200M0 300h1200M0 470h1200M0 640h1200M0 810h1200"/>
  </g>
  <g stroke="#8F6742" stroke-width="3" opacity=".3">
    <path d="M300 0v900M760 0v900"/>
  </g>

  <!-- saucer + cup, top view -->
  <g>
    <circle cx="600" cy="450" r="290" fill="#EFE6D6"/>
    <circle cx="600" cy="450" r="290" fill="none" stroke="#D9CDB8" stroke-width="6"/>
    <circle cx="600" cy="450" r="234" fill="#FBF8F2"/>
    <circle cx="600" cy="450" r="200" fill="#E7DAC4"/>
    <circle cx="600" cy="450" r="184" fill="#9B6B3E"/>
    <circle cx="600" cy="450" r="176" fill="#8A5A34"/>
    <!-- latte art rosetta -->
    <g fill="#F6EBDA">
      <path d="M600 300c56 44 74 110 44 176-18 40-44 70-44 104 0-34-26-64-44-104-30-66-12-132 44-176z"/>
      <g opacity=".95">
        <path d="M600 330c36 20 56 52 62 92-24-30-44-46-62-54-18 8-38 24-62 54 6-40 26-72 62-92z"/>
        <path d="M600 404c40 20 62 54 68 96-26-32-48-48-68-56-20 8-42 24-68 56 6-42 28-76 68-96z"/>
        <path d="M600 486c40 20 62 54 68 96-26-32-48-48-68-56-20 8-42 24-68 56 6-42 28-76 68-96z"/>
      </g>
      <ellipse cx="600" cy="286" rx="34" ry="26"/>
    </g>
    <circle cx="600" cy="450" r="184" fill="none" stroke="#6E4429" stroke-width="4" opacity=".5"/>
    <!-- handle -->
    <path d="M824 404c72 0 108 44 108 92s-40 88-108 88" fill="none" stroke="#FBF8F2" stroke-width="46" stroke-linecap="round"/>
    <path d="M824 404c72 0 108 44 108 92s-40 88-108 88" fill="none" stroke="#D9CDB8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- spoon -->
  <g fill="#D9CDB8">
    <ellipse cx="270" cy="700" rx="44" ry="30" transform="rotate(-24 270 700)"/>
    <path d="M300 676l180-150a16 16 0 0 1 22 22L322 698z"/>
  </g>

  <!-- small plate with cookie -->
  <g>
    <circle cx="985" cy="742" r="118" fill="#FBF8F2"/>
    <circle cx="985" cy="742" r="118" fill="none" stroke="#D9CDB8" stroke-width="6"/>
    <circle cx="985" cy="742" r="86" fill="#C79157"/>
    <g fill="#5B3A22">
      <circle cx="955" cy="712" r="12"/><circle cx="1012" cy="726" r="12"/>
      <circle cx="972" cy="768" r="12"/><circle cx="1024" cy="776" r="11"/>
      <circle cx="944" cy="762" r="10"/>
    </g>
    <path d="M916 700c30-24 78-30 118-14" stroke="#A97647" stroke-width="6" fill="none" opacity=".6"/>
  </g>

  <!-- scattered coffee beans -->
  <g fill="#5B3A22">
    <g transform="translate(180 250) rotate(-20)"><ellipse rx="26" ry="17"/><path d="M-24 0h48" stroke="#8A5A34" stroke-width="4"/></g>
    <g transform="translate(246 168) rotate(35)"><ellipse rx="24" ry="16"/><path d="M-22 0h44" stroke="#8A5A34" stroke-width="4"/></g>
    <g transform="translate(1040 214) rotate(-45)"><ellipse rx="25" ry="16"/><path d="M-23 0h46" stroke="#8A5A34" stroke-width="4"/></g>
    <g transform="translate(1108 330) rotate(15)"><ellipse rx="24" ry="16"/><path d="M-22 0h44" stroke="#8A5A34" stroke-width="4"/></g>
    <g transform="translate(150 520) rotate(60)"><ellipse rx="24" ry="16"/><path d="M-22 0h44" stroke="#8A5A34" stroke-width="4"/></g>
  </g>

  <!-- sprig of dried flowers top-left -->
  <g opacity=".9">
    <path d="M60 40c70 40 120 110 140 190" stroke="#8B9679" stroke-width="7" fill="none"/>
    <g fill="#D8A7A0"><circle cx="112" cy="96" r="15"/><circle cx="152" cy="152" r="14"/><circle cx="182" cy="212" r="15"/></g>
    <g fill="#75806A"><path d="M96 76c-24-6-40 4-52 26 24-2 42-10 52-26z"/><path d="M150 132c-26-4-42 8-52 30 24-4 42-14 52-30z"/></g>
  </g>

  <rect width="1200" height="900" fill="#49352B" opacity=".05"/>
</svg>
