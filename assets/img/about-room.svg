<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration der Kaffeetheke mit Barista">
  <defs>
    <linearGradient id="r-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E7D5"/>
      <stop offset="1" stop-color="#E0D0B4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#r-wall)"/>

  <!-- tiles behind counter -->
  <g fill="none" stroke="#D3C0A2" stroke-width="5">
    <path d="M0 120h1200M0 240h1200M0 360h1200"/>
    <path d="M100 0v360M300 0v360M500 0v360M700 0v360M900 0v360M1100 0v360"/>
  </g>
  <g fill="#A8B8B8" opacity=".35">
    <rect x="100" y="120" width="200" height="120"/><rect x="500" y="240" width="200" height="120"/>
    <rect x="900" y="0" width="200" height="120"/><rect x="300" y="120" width="200" height="120"/>
  </g>

  <!-- menu board -->
  <g>
    <rect x="360" y="46" width="480" height="230" rx="14" fill="#3A3630"/>
    <rect x="378" y="64" width="444" height="194" rx="8" fill="none" stroke="#B98555" stroke-width="5" opacity=".8"/>
    <text x="600" y="132" text-anchor="middle" font-family="Segoe Script, cursive" font-size="54" fill="#F4EFE6">Heute bei uns</text>
    <g font-family="Segoe UI, sans-serif" font-size="26" fill="#E4C79F">
      <text x="416" y="188">Flat White</text><text x="784" y="188" text-anchor="end" fill="#A8B8B8">3,80</text>
      <text x="416" y="232">Kürbiskuchen</text><text x="784" y="232" text-anchor="end" fill="#A8B8B8">4,50</text>
    </g>
    <path d="M416 154h368" stroke="#F4EFE6" stroke-width="3" opacity=".4"/>
  </g>

  <!-- pendant lamps -->
  <g>
    <path d="M240 0v96M960 0v70" stroke="#49352B" stroke-width="7"/>
    <path d="M180 96h120l-24 70h-72z" fill="#49352B"/>
    <ellipse cx="240" cy="168" rx="26" ry="14" fill="#FFE9B8"/>
    <path d="M906 70h108l-22 64h-64z" fill="#B98555"/>
    <ellipse cx="960" cy="136" rx="24" ry="13" fill="#FFE9B8"/>
  </g>

  <!-- espresso machine -->
  <g>
    <rect x="140" y="330" width="330" height="150" rx="16" fill="#49352B"/>
    <rect x="156" y="346" width="298" height="70" rx="10" fill="#6E5847"/>
    <rect x="176" y="416" width="60" height="64" rx="8" fill="#A8B8B8"/>
    <rect x="266" y="416" width="60" height="64" rx="8" fill="#A8B8B8"/>
    <g fill="#E4C79F"><circle cx="206" cy="380" r="16"/><circle cx="330" cy="380" r="16"/><circle cx="392" cy="380" r="16"/></g>
    <rect x="176" y="480" width="60" height="18" rx="6" fill="#B98555"/>
    <rect x="266" y="480" width="60" height="18" rx="6" fill="#B98555"/>
    <!-- cups below -->
    <g fill="#FBF8F2"><rect x="186" y="446" width="40" height="34" rx="6"/><rect x="276" y="446" width="40" height="34" rx="6"/></g>
    <g stroke="#FBF8F2" stroke-width="7" fill="none" opacity=".65" stroke-linecap="round">
      <path d="M206 318c-16-22 10-36-4-58M306 318c-16-22 10-36-4-58"/>
    </g>
  </g>

  <!-- grinder & jars -->
  <g>
    <path d="M540 480V336h74v144z" fill="#6E4B30"/>
    <path d="M536 336l82-70 8 10-70 70z" fill="#49352B"/>
    <rect x="548" y="300" width="58" height="40" rx="8" fill="#B98555"/>
    <rect x="668" y="376" width="76" height="104" rx="10" fill="#FBF8F2" stroke="#D9CDB8" stroke-width="5"/>
    <rect x="662" y="356" width="88" height="26" rx="10" fill="#8E643F"/>
    <path d="M684 400h44M684 424h44" stroke="#8A5A34" stroke-width="6"/>
    <rect x="776" y="404" width="66" height="76" rx="8" fill="#75806A"/>
    <rect x="770" y="386" width="78" height="24" rx="10" fill="#5F6B52"/>
  </g>

  <!-- barista -->
  <g>
    <path d="M1000 480c0-96 40-160 116-160s116 64 116 160z" fill="#A8B8B8"/>
    <path d="M1064 320h104v52h-104z" fill="#E8C9A8"/>
    <circle cx="1116" cy="286" r="74" fill="#E8C9A8"/>
    <path d="M1042 274c0-52 34-84 74-84s74 32 74 84c-24-22-52-32-74-32s-50 10-74 32z" fill="#4A3A31"/>
    <path d="M1056 262c14-30 42-48 76-44-30 6-56 22-76 44z" fill="#5C4A3E"/>
    <!-- apron -->
    <path d="M1064 400h104v80h-104z" fill="#75806A"/>
    <path d="M1064 400l-30 34 16 46h-16v-16l30-40z" fill="#8B9679"/>
    <path d="M1168 400l30 34-16 46h16v-16l-30-40z" fill="#8B9679"/>
    <circle cx="1116" cy="452" r="14" fill="#F4EFE6" opacity=".7"/>
    <!-- arms holding cup -->
    <path d="M1004 430c-46 14-72 44-78 84l52 16c8-28 26-46 54-56z" fill="#A8B8B8"/>
    <path d="M1232 430c46 14 72 44 78 84l-52 16c-8-28-26-46-54-56z" fill="#A8B8B8"/>
    <ellipse cx="1116" cy="530" rx="52" ry="20" fill="#E8C9A8"/>
    <path d="M1080 500h72v46h-72z" fill="#FBF8F2"/>
    <ellipse cx="1116" cy="500" rx="36" ry="10" fill="#EDE3D2"/>
    <ellipse cx="1116" cy="501" rx="27" ry="7" fill="#8A5A34"/>
  </g>

  <!-- counter -->
  <rect y="486" width="1200" height="60" fill="#8E643F"/>
  <rect y="546" width="1200" height="130" fill="#6E4B30"/>
  <g stroke="#5A3D27" stroke-width="6" opacity=".55"><path d="M200 546v130M560 546v130M920 546v130M1180 546v130"/></g>

  <!-- foreground: pastries on counter -->
  <g>
    <ellipse cx="360" cy="500" rx="150" ry="26" fill="#EDE3D2"/>
    <path d="M246 500a114 74 0 0 1 228 0z" fill="#E0B279"/>
    <path d="M246 496c18-14 34 8 52-4s34 10 52-2 36 8 54-4 42 8 64 2v14H246z" fill="#FBF8F2"/>
    <circle cx="360" cy="430" r="13" fill="#C4664A"/>

    <ellipse cx="700" cy="502" rx="140" ry="26" fill="#EDE3D2"/>
    <g fill="#D9A441">
      <ellipse cx="640" cy="494" rx="52" ry="26"/><ellipse cx="712" cy="494" rx="52" ry="26"/><ellipse cx="774" cy="500" rx="46" ry="24"/>
    </g>
    <g stroke="#B5763E" stroke-width="4" opacity=".6" fill="none">
      <path d="M604 490c22 8 46 8 68 0M676 490c22 8 46 8 68 0"/>
    </g>
  </g>

  <rect width="1200" height="900" fill="#49352B" opacity=".05"/>
</svg>
