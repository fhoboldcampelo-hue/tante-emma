    <g fill="#C79157"><circle cx="686" cy="316" r="16"/><circle cx="724" cy="332" r="15"/><circle cx="710" cy="292" r="14"/></g>
    <g fill="#5B3A22"><circle cx="684" cy="312" r="4"/><circle cx="726" cy="330" r="4"/><circle cx="710" cy="288" r="4"/></g>
