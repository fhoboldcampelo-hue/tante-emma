<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration eines Stücks Rhabarberkuchen">
  <rect width="800" height="600" fill="#E9DCC6"/>
  <g opacity=".2" fill="#B98555">
    <circle cx="80" cy="70" r="30"/><circle cx="730" cy="90" r="24"/><circle cx="90" cy="520" r="24"/>
  </g>

  <rect y="420" width="800" height="180" fill="#FBF8F2"/>
  <ellipse cx="400" cy="438" rx="330" ry="56" fill="#EFE6D6"/>
  <ellipse cx="400" cy="434" rx="330" ry="52" fill="#FBF8F2"/>
  <ellipse cx="400" cy="434" rx="330" ry="52" fill="none" stroke="#D9CDB8" stroke-width="5"/>

  <!-- cake slice -->
  <g>
    <!-- back crust -->
    <path d="M470 186l86 46v178l-86-30z" fill="#C79157"/>
    <!-- top -->
    <path d="M214 264 470 186l86 46-256 78z" fill="#E0B279"/>
    <!-- filling layers -->
    <path d="M214 264 556 310v40L214 304z" fill="#FBF8F2"/>
    <path d="M214 304 556 350v34L214 338z" fill="#C4664A"/>
    <path d="M214 338 556 384v30L214 368z" fill="#FBF8F2"/>
    <path d="M214 368 556 414v16L214 384z" fill="#C4664A"/>
    <!-- front -->
    <path d="M214 264v120l342 46v-16l-342-46z" fill="#D9A441" opacity=".25"/>
    <path d="M556 310v120l-342-46V264z" fill="#E8C98A" opacity="0"/>
    <!-- fruit pieces on top -->
    <g fill="#C4664A">
      <path d="M300 246l40-14 16 24-40 16z"/>
      <path d="M372 226l40-14 16 24-40 16z"/>
      <path d="M446 206l38-14 16 24-40 16z"/>
    </g>
    <g fill="#75806A">
      <path d="M334 236c-18-10-34-8-48 6 18 6 34 4 48-6z"/>
      <path d="M470 210c-18-10-34-8-48 6 18 6 34 4 48-6z"/>
    </g>
    <!-- powdered sugar -->
    <g fill="#FBF8F2" opacity=".9">
      <circle cx="330" cy="300" r="7"/><circle cx="404" cy="296" r="6"/>
      <circle cx="472" cy="318" r="7"/><circle cx="536" cy="342" r="6"/>
      <circle cx="272" cy="318" r="6"/><circle cx="510" cy="372" r="5"/>
    </g>
  </g>

  <!-- fork -->
  <g fill="#D9CDB8" transform="translate(150 500) rotate(-8)">
    <rect x="-90" y="-9" width="180" height="18" rx="9"/>
    <rect x="-136" y="-30" width="14" height="60" rx="6"/>
    <rect x="-114" y="-30" width="14" height="60" rx="6"/>
    <rect x="-92" y="-30" width="14" height="60" rx="6"/>
    <path d="M-70-24h34v48h-34z"/>
  </g>

  <!-- berries -->
  <g>
    <circle cx="648" cy="470" r="22" fill="#C4664A"/>
    <circle cx="690" cy="492" r="19" fill="#B8544A"/>
    <circle cx="628" cy="508" r="17" fill="#D9A441"/>
    <g fill="#75806A"><path d="M648 448c14-10 28-10 42 2-16 4-30 4-42-2z"/></g>
  </g>

  <rect width="800" height="600" fill="#49352B" opacity=".04"/>
</svg>
