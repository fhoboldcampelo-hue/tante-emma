<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration einer Blumenvase mit kleinen Fundstücken">
  <defs>
    <linearGradient id="f-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E9D9"/>
      <stop offset="1" stop-color="#E3D3B8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#f-wall)"/>

  <!-- wall art -->
  <g>
    <rect x="90" y="80" width="330" height="250" rx="12" fill="#49352B"/>
    <rect x="110" y="100" width="290" height="210" rx="5" fill="#FBF8F2"/>
    <circle cx="204" cy="176" r="52" fill="#D9A441"/>
    <path d="M110 310c56-72 118-34 166-84 36-38 76-46 124-30v114H110z" fill="#A8B8B8"/>
    <path d="M110 310c40-44 84-52 130-42-46 4-90 20-130 42z" fill="#75806A"/>

    <rect x="800" y="60" width="300" height="230" rx="12" fill="#B98555"/>
    <rect x="820" y="80" width="260" height="190" rx="5" fill="#F4EFE6"/>
    <g fill="#C4664A"><circle cx="900" cy="150" r="34"/><circle cx="972" cy="196" r="28"/><circle cx="1030" cy="130" r="24"/></g>
    <path d="M820 270c58-56 108-34 152-72 30-26 70-30 108-16v88H820z" fill="#75806A"/>
  </g>

  <!-- shelf -->
  <rect x="60" y="360" width="1080" height="24" rx="8" fill="#8E643F"/>
  <rect x="60" y="384" width="1080" height="10" rx="5" fill="#6E4B30" opacity=".7"/>

  <!-- objects on shelf -->
  <g>
    <!-- teapot -->
    <path d="M140 360c0-52 36-86 84-86s84 34 84 86z" fill="#A8B8B8"/>
    <path d="M308 300c40-6 62 14 62 40s-24 42-56 42" fill="none" stroke="#A8B8B8" stroke-width="18"/>
    <path d="M140 316c-30 4-50 18-58 44h44z" fill="#8FA3A3"/>
    <rect x="196" y="254" width="56" height="22" rx="10" fill="#8FA3A3"/>
    <circle cx="224" cy="248" r="14" fill="#8FA3A3"/>

    <!-- jars -->
    <rect x="420" y="262" width="94" height="98" rx="12" fill="#FBF8F2"/>
    <rect x="420" y="262" width="94" height="98" rx="12" fill="none" stroke="#D9CDB8" stroke-width="5"/>
    <rect x="414" y="242" width="106" height="30" rx="10" fill="#8E643F"/>
    <rect x="436" y="300" width="62" height="44" rx="8" fill="#C79157"/>
    <path d="M446 312h42M446 326h42" stroke="#8A5A34" stroke-width="4"/>

    <rect x="556" y="284" width="82" height="76" rx="10" fill="#E4C79F"/>
    <rect x="550" y="266" width="94" height="28" rx="10" fill="#75806A"/>
    <text x="597" y="332" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#49352B">Keks</text>

    <!-- small cups stacked -->
    <path d="M700 360v-46h72v46z" fill="#FBF8F2"/>
    <ellipse cx="736" cy="314" rx="36" ry="10" fill="#EDE3D2"/>
    <path d="M712 314v-40h48v40z" fill="#D8A7A0"/>
    <ellipse cx="736" cy="274" rx="24" ry="8" fill="#FBF8F2"/>

    <!-- vase with dried flowers -->
    <path d="M900 360c-22-46-16-88 22-116 40 28 44 70 24 116z" fill="#C4664A"/>
    <path d="M924 244c-6-64-40-104-88-124 30 54 54 88 88 124z" fill="#8B9679"/>
    <path d="M924 244c10-70 48-110 104-128-38 58-68 94-104 128z" fill="#75806A"/>
    <path d="M924 244c-2-56 16-96 54-124-14 50-26 86-54 124z" fill="#A8B8B8"/>
    <g fill="#D9A441"><circle cx="860" cy="130" r="20"/><circle cx="1000" cy="126" r="18"/><circle cx="944" cy="106" r="22"/></g>
    <g fill="#D8A7A0"><circle cx="892" cy="176" r="16"/><circle cx="972" cy="172" r="16"/></g>

    <!-- little frame -->
    <rect x="1040" y="278" width="86" height="82" rx="6" fill="#49352B"/>
    <rect x="1050" y="288" width="66" height="62" rx="3" fill="#F4EFE6"/>
    <path d="M1050 350c18-24 34-12 48-30 8-10 14-12 18-10v40h-66z" fill="#C4664A"/>
  </g>

  <!-- table -->
  <rect y="560" width="1200" height="340" fill="#B5895C"/>
  <g stroke="#93704C" stroke-width="5" opacity=".45"><path d="M0 650h1200M0 760h1200"/></g>
  <rect y="552" width="1200" height="18" fill="#8E643F"/>

  <!-- foreground vase with fresh flowers -->
  <g>
    <path d="M470 700h180l-26 176H496z" fill="#4E7C7B"/>
    <path d="M470 700h180l-8 40H478z" fill="#5E8C8B"/>
    <g stroke="#75806A" stroke-width="9" fill="none">
      <path d="M560 700c-30-90-90-140-160-168"/>
      <path d="M560 700c10-100 60-160 130-196"/>
      <path d="M560 700c-4-88-4-160 6-236"/>
    </g>
    <g fill="#75806A">
      <path d="M520 640c-46-16-84-8-112 24 44 14 84 6 112-24z"/>
      <path d="M604 616c46-20 86-16 116 14-44 18-86 14-116-14z"/>
      <path d="M566 560c-40-24-78-24-112 4 40 22 78 22 112-4z"/>
    </g>
    <g>
      <circle cx="400" cy="532" r="46" fill="#D9A441"/>
      <circle cx="400" cy="532" r="20" fill="#C4664A"/>
      <circle cx="690" cy="504" r="42" fill="#D8A7A0"/>
      <circle cx="690" cy="504" r="18" fill="#FBF8F2"/>
      <circle cx="566" cy="464" r="50" fill="#C4664A"/>
      <circle cx="566" cy="464" r="22" fill="#F1D8B4"/>
      <circle cx="486" cy="576" r="30" fill="#A8B8B8"/>
      <circle cx="644" cy="576" r="28" fill="#75806A"/>
    </g>
  </g>

  <!-- coffee cup on table right -->
  <g>
    <ellipse cx="960" cy="806" rx="112" ry="34" fill="#E4D8C3"/>
    <path d="M864 786c0 46 42 74 96 74s96-28 96-74z" fill="#FBF8F2"/>
    <ellipse cx="960" cy="784" rx="96" ry="30" fill="#FBF8F2"/>
    <ellipse cx="960" cy="786" rx="76" ry="22" fill="#8A5A34"/>
    <path d="M1054 776c46 0 68 22 68 46s-24 42-68 42" fill="none" stroke="#FBF8F2" stroke-width="26"/>
  </g>

  <!-- books left -->
  <g>
    <rect x="70" y="782" width="230" height="44" rx="8" fill="#C4664A"/>
    <rect x="86" y="740" width="220" height="44" rx="8" fill="#75806A"/>
    <rect x="74" y="700" width="210" height="42" rx="8" fill="#A8B8B8"/>
    <path d="M100 716h140M112 754h140M112 800h150" stroke="#F4EFE6" stroke-width="6" opacity=".7"/>
  </g>

  <rect width="1200" height="900" fill="#49352B" opacity=".05"/>
</svg>
