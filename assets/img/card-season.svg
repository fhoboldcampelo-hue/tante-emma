<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration einer saisonalen Kürbis-Tarte">
  <rect width="800" height="600" fill="#E7DAC2"/>
  <g opacity=".2" fill="#75806A"><circle cx="80" cy="80" r="28"/><circle cx="724" cy="110" r="26"/><circle cx="110" cy="530" r="24"/><circle cx="700" cy="520" r="28"/></g>

  <rect y="430" width="800" height="170" fill="#B5895C"/>
  <g stroke="#93704C" stroke-width="4" opacity=".45"><path d="M0 486h800M0 548h800"/></g>

  <!-- tart tin -->
  <ellipse cx="400" cy="430" rx="292" ry="74" fill="#8E643F"/>
  <ellipse cx="400" cy="424" rx="292" ry="70" fill="#D9CDB8"/>
  <ellipse cx="400" cy="420" rx="266" ry="60" fill="#C79157"/>

  <!-- crust edge -->
  <path d="M134 420a266 60 0 0 1 532 0" fill="#E0B279"/>
  <g fill="#C79157">
    <circle cx="160" cy="412" r="18"/><circle cx="216" cy="386" r="18"/><circle cx="280" cy="366" r="18"/>
    <circle cx="350" cy="356" r="18"/><circle cx="420" cy="354" r="18"/><circle cx="490" cy="362" r="18"/>
    <circle cx="556" cy="378" r="18"/><circle cx="614" cy="400" r="18"/><circle cx="646" cy="418" r="18"/>
  </g>

  <!-- pumpkin filling -->
  <path d="M158 420a244 54 0 0 1 484 0z" fill="#E08B3C"/>
  <path d="M186 420a216 46 0 0 1 428 0z" fill="#EE9C4A"/>
  <!-- pumpkin segments -->
  <g stroke="#C4664A" stroke-width="5" opacity=".55" fill="none">
    <path d="M400 366v56M330 372c-14 18-20 34-22 50M470 372c14 18 20 34 22 50M262 392c-8 12-12 22-14 30M538 392c8 12 12 22 14 30"/>
  </g>

  <!-- cream dollops -->
  <g fill="#FBF8F2">
    <ellipse cx="250" cy="410" rx="34" ry="22"/><ellipse cx="324" cy="396" rx="32" ry="21"/>
    <ellipse cx="400" cy="390" rx="34" ry="22"/><ellipse cx="476" cy="396" rx="32" ry="21"/>
    <ellipse cx="550" cy="410" rx="34" ry="22"/>
  </g>
  <g fill="#FFFDF8">
    <ellipse cx="250" cy="404" rx="22" ry="13"/><ellipse cx="324" cy="390" rx="21" ry="13"/>
    <ellipse cx="400" cy="384" rx="22" ry="13"/><ellipse cx="476" cy="390" rx="21" ry="13"/>
    <ellipse cx="550" cy="404" rx="22" ry="13"/>
  </g>

  <!-- cinnamon + star anise decorations -->
  <g transform="translate(672 470)">
    <rect x="-58" y="-14" width="116" height="28" rx="14" fill="#8A5A34" transform="rotate(-16)"/>
  </g>
  <g transform="translate(140 486)" fill="#6E4429">
    <ellipse rx="12" ry="32"/><ellipse rx="32" ry="12"/><ellipse rx="23" ry="23" transform="rotate(45)"/><ellipse rx="23" ry="23" transform="rotate(-45)"/>
  </g>

  <!-- leaves -->
  <g fill="#75806A">
    <path d="M96 396c-34-16-62-10-84 18 32 10 62 4 84-18z"/>
    <path d="M712 386c34-16 62-10 84 18-32 10-62 4-84-18z"/>
  </g>

  <rect width="800" height="600" fill="#49352B" opacity=".05"/>
</svg>
